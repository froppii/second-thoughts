<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>second thoughts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Freckle+Face&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#fff;--ink:#111;--gray:#d9d9d9;--mute:#6f6f6f;--note:#fff3a6;--up:#1f8f4e;--dn:#d23b3b;
  --h1:#ffd84d;--h2:#8fd3ff;--h3:#ff9e9e;--h4:#9becc0;--h5:#cdb3ff;--h6:#ffc58f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:700 26px/1.25 'Gaegu','Comic Sans MS',cursive;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2.5px dashed var(--ink);outline-offset:6px}
.mute{color:var(--mute);font-weight:400}
.up{color:var(--up)}.dn{color:var(--dn)}
.err{color:var(--dn);font-size:22px;margin:0}

/* the hand-drawn bits: thin shapes pushed through an SVG noise filter */
.rough-line{display:block;height:2.5px;background:var(--ink);filter:url(#roughH)}
.divider{width:3px;align-self:stretch;margin:4vh 0;background:var(--ink);filter:url(#roughV)}
.sketch{position:relative}
.sketch::before{content:'';position:absolute;inset:0;border:2.5px solid var(--ink);border-radius:16px 6px 14px 5px/6px 14px 5px 16px;filter:url(#rough);pointer-events:none}

.title{font-family:'Freckle Face','Gaegu',cursive;font-weight:400;line-height:.8;margin:0;font-size:clamp(72px,9.5vw,132px);letter-spacing:-.01em}
.title span{display:block}.title span+span{padding-left:.82em}
.title.mid{font-size:clamp(60px,8vw,112px)}.title.sm{font-size:56px}.title.xs{font-size:38px}

.link{font-size:34px;font-weight:400;padding:2px 4px;text-underline-offset:7px;text-decoration-thickness:2px}
.link:hover,.link.on{text-decoration:underline}
.next{font-size:34px;font-weight:400;margin-top:18px}.next span{font-size:.9em}
nav{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:34px}

/* landing */
.home{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.brand{position:relative}
/* minecraft-style splash: yellow, hard shadow, tilted, pulsing */
.splash{position:absolute;left:103%;top:84%;margin:0;transform:translate(-12%,-50%) rotate(-20deg);white-space:nowrap;cursor:pointer;user-select:none;-webkit-user-select:none;z-index:2}
.splash span{display:inline-block;color:#ffff00;text-shadow:3px 3px 0 #3f3f00;font:700 34px 'Gaegu',cursive;animation:splash .5s ease-in-out infinite alternate}
@keyframes splash{from{transform:scale(.94)}to{transform:scale(1.06)}}

/* join / create split */
.split{min-height:100vh;display:grid;grid-template-columns:1fr auto 1fr;padding:0 4vw}
.split>section{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px}
.stack{display:flex;flex-direction:column;align-items:center;width:min(470px,100%);gap:30px}
.field{display:block;width:100%;text-align:center;font-size:34px;font-weight:400}
.field input{display:block;width:100%;border:0;background:transparent;font:700 34px 'Gaegu',cursive;text-align:center;padding:6px 0 2px;color:var(--ink);outline:none}
.field input::placeholder{color:#bbb}
.field:focus-within .rough-line{height:4px}
.prompt{font-size:32px;font-weight:400;text-align:center;margin:10px 0}
.prompt.ask{margin:0 0 -10px}

/* players: gray squares with googly eyes */
.crowd{position:relative;width:min(980px,100%);margin:0 auto}
.pl{position:absolute;width:96px;text-align:center}
.sq{width:96px;height:96px;background:var(--gray);display:flex;gap:2px;padding:24px 0 0 0;justify-content:center;align-items:flex-start}
.eye{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#fff 50%,#e8e8e8 100%);box-shadow:inset 0 0 0 2px #cfcfcf,0 1.5px 2px rgba(0,0,0,.3);display:grid;place-items:center}
.eye b{width:21px;height:21px;border-radius:50%;background:var(--ink);transition:transform .18s ease-out}
.pl .nm{font-size:28px;font-weight:400;margin-top:2px;white-space:nowrap}
.bubble{position:absolute;bottom:calc(100% + 16px);left:48px;z-index:2;background:var(--paper);padding:4px 16px;font-size:26px;font-weight:400;white-space:nowrap;max-width:300px;overflow:visible}
.bubble>span{display:block;overflow:hidden;text-overflow:ellipsis}
.bubble::before{border-radius:40px 30px 36px 32px/30px 40px 28px 38px}
.bubble svg{position:absolute;left:10px;top:calc(100% - 3px)}
.pl.r .bubble{left:auto;right:48px}.pl.r .bubble svg{left:auto;right:10px;transform:scaleX(-1)}
.pl.wait .bubble{color:var(--mute)}
.solo{display:flex;justify-content:center;padding-top:90px}.solo .pl{position:relative}
.solo .bubble{left:50%;transform:translateX(-50%);white-space:normal;width:max-content;max-width:min(300px,80vw);text-align:center}.solo .bubble svg{left:calc(50% - 26px)}

/* host chrome */
.room{position:fixed;right:28px;bottom:18px;text-align:right;line-height:.85}
.room b{display:block;font:400 76px 'Freckle Face','Gaegu',cursive;letter-spacing:.02em}
.room span{display:block;font-size:32px;font-weight:400}
.room small{display:block;font-size:20px;color:var(--mute);font-weight:400;margin-top:6px}
.room small span{display:inline;font-size:inherit;color:var(--ink)}
.room .qr{display:inline-block;padding:8px;background:#fff;margin-bottom:10px}.room .qr img,.room .qr canvas{display:block;width:120px;height:120px}
.screen{min-height:100vh;padding:40px 24px 140px;display:flex;flex-direction:column;align-items:center}
.topbar{display:flex;align-items:center;gap:28px;width:min(1200px,100%)}
.topbar .prompt{text-align:left;margin:0}
.big{font:400 64px 'Freckle Face','Gaegu',cursive;margin:12px 0}
.sticky{background:var(--note);padding:16px 22px;transform:rotate(-1.4deg);box-shadow:0 8px 18px rgba(0,0,0,.12);font-weight:400;font-size:25px;text-align:left;max-width:560px}
.sticky b{display:block;font-weight:700;font-size:22px;margin-bottom:4px}

/* market */
.mk{display:grid;grid-template-columns:1.7fr 1fr;gap:48px;width:min(1200px,100%);margin-top:30px;align-items:start}
.row{display:grid;grid-template-columns:200px 1fr 110px;gap:16px;align-items:center;margin:16px 0}
.row .nm{text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:46px}.track>div{position:absolute;inset:5px;overflow:hidden;border-radius:10px 4px 9px 4px}
.track i{display:block;height:100%;transition:width .45s ease}
.px{font-size:30px}
.pitch{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin-bottom:34px}
.pitch .solo{padding-top:96px}
.timer{font:400 56px 'Freckle Face','Gaegu',cursive}

/* phone screens */
.phone{max-width:520px;margin:0 auto;padding:24px 18px 60px;display:flex;flex-direction:column;gap:14px}
.phone h2{font-size:34px;margin:6px 0 0}
.tap{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 10px;text-align:left;padding:14px 18px;width:100%;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tap .tp{font-size:32px}
.tap .dots{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;min-height:18px}
.tap .dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink)}
.tap.pop{animation:pop .18s ease-out}
@keyframes pop{50%{transform:scale(.96) rotate(-.6deg)}}
.buy{display:grid;grid-template-columns:1fr auto;align-items:center;text-align:left;padding:14px 18px;width:100%}
.buy .bp{font-size:34px}.buy .bs{grid-column:1/-1;font-size:20px;font-weight:400;color:var(--mute)}
.tap .sw,.buy .sw{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:8px;vertical-align:1px}
.buy:active:not(:disabled){transform:scale(.98)}

/* line chart, closing bell, results */
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font:400 18px 'Gaegu',cursive;fill:#7a7a7a}.chart .lb{font:700 23px 'Gaegu',cursive;fill:#111}.chart .mk{font:400 18px 'Gaegu',cursive;fill:#7a7a7a}
.chartbox{padding:14px 16px 8px;margin-bottom:10px;width:100%}
.screen>.chartbox{width:min(1200px,100%);margin-top:26px}
.bell{display:grid;grid-template-columns:2.2fr 1fr;gap:40px;align-items:center;width:min(1240px,100%);margin-top:18px}.bell aside{display:flex;flex-direction:column;align-items:center;gap:22px}
.win{font-size:clamp(56px,8vw,110px);text-align:center;line-height:.95;margin:6px 0 10px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;width:min(1200px,100%);margin-top:34px}
.box{padding:18px 22px;font-size:23px;font-weight:400}
.box h3{margin:0 0 8px;font-size:28px}
.box div{display:flex;justify-content:space-between;gap:10px}

@media (max-width:760px){
  body{font-size:24px}
  .split{grid-template-columns:1fr;padding:0;align-content:start}
  .split .divider{display:none}
  .split>section{padding:28px 18px 8px}
  .split .left .title{font-size:64px}
  .split nav{flex-direction:row;gap:22px;margin-top:20px}.split .link{font-size:28px}
  .splash{left:70%;top:100%}.splash span{font-size:24px}
  .mk,.cols,.bell{grid-template-columns:1fr}
  .row{grid-template-columns:110px 1fr 70px}
  .room{position:static;text-align:center;margin-top:30px}
}
/* flow: screens slide in, a title card announces each phase, a fuse burns down the timer */
main{animation:enter .35s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(10px)}}
.fuse{position:fixed;left:0;right:0;top:0;height:7px;z-index:5}
.fuse i{display:block;height:100%;background:var(--ink);transition:width 1s linear;border-radius:0 4px 4px 0;filter:url(#roughH)}
.fuse.hot i{background:var(--dn)}
.intro{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:9}
.intro b{font:400 clamp(54px,9vw,120px) 'Freckle Face','Gaegu',cursive;background:var(--note);padding:10px 40px;box-shadow:0 14px 30px rgba(0,0,0,.18);animation:card 1.7s ease-in-out forwards;text-align:center;max-width:92vw}
@keyframes card{0%{transform:translateX(-120vw) rotate(-6deg)}22%{transform:translateX(0) rotate(-2deg)}78%{transform:translateX(0) rotate(-2deg);opacity:1}100%{transform:translateX(120vw) rotate(4deg);opacity:0}}
.clock{font:400 44px 'Freckle Face','Gaegu',cursive;margin-left:auto}
.feed{display:flex;flex-direction:column;gap:14px;width:100%;align-items:center}
.feed .sticky:nth-child(2){transform:rotate(1.2deg);background:#e7f6ff}.feed .sticky:nth-child(3){transform:rotate(-.6deg);background:#ffe9ef}
.mic{font-size:21px;text-align:left;margin:0;font-weight:400;border-left:4px solid var(--h1);padding-left:10px}
.pl.off{opacity:.35}
.skip{font-size:26px;margin-top:10px}
.conn{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:6px 16px;font-size:20px;font-weight:400;z-index:10;border-radius:6px}
.tap .tp small{font-size:18px;color:var(--mute);font-weight:400;margin-left:6px}

</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4"/></filter>
  <filter id="roughH" x="-2%" y="-300%" width="104%" height="700%"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/></filter>
  <filter id="roughV" x="-300%" y="-2%" width="700%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/></filter>
</svg>
<div id="app"></div>
<div id="intro" class="intro"></div>
<div id="conn"></div>
<script src="/config.js"></script>
<script type="module" src="/app.js"></script>
</html>
